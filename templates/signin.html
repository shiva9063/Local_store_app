<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Store - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/signin.css') }}">
</head>
<body>

<div id="login">

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to your Local Store account</p>

    <form id="login_form" action="{{ url_for('login') }}" method="POST">

        <!-- Login using Email or Mobile -->
        <div class="form-group">
            <label for="login_type">Login With :</label>

            <select id="login_type" name="login_type">
                <option value="email">Email ID</option>
                <option value="contact">Contact Number</option>
            </select>
        </div>

        <!-- Email or Mobile Input -->
        <div class="form-group">
            <label id="identity_label" for="identity">Email ID :</label>

            <input
                type="email"
                id="identity"
                name="identity"
                placeholder="Enter your email"
                maxlength="50"
                autocomplete="email"
                required
            >
        </div>

        <!-- Login Method -->
        <div class="login-options">
            <button type="button" id="password_btn" class="active">
                Password
            </button>

            <button type="button" id="otp_btn">
                Login with OTP
            </button>
        </div>

        <!-- Password Field -->
        <div class="form-group" id="password_group">
            <label for="password">Password :</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <!-- OTP Field -->
        <div class="form-group" id="otp_group" style="display:none;">
            <label for="otp">Enter OTP :</label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter OTP"
                maxlength="6"
                inputmode="numeric"
                disabled
            >
        </div>

        <div class="forgot-password">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" id="login_button">
            Login
        </button>

    </form>

    <p class="signup-link">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create Account</a>
    </p>

</div>

<!-- JavaScript -->
<script>

const loginType = document.getElementById("login_type");
const identity = document.getElementById("identity");
const identityLabel = document.getElementById("identity_label");

const passwordBtn = document.getElementById("password_btn");
const otpBtn = document.getElementById("otp_btn");

const passwordGroup = document.getElementById("password_group");
const otpGroup = document.getElementById("otp_group");

const password = document.getElementById("password");
const otp = document.getElementById("otp");

// Email or Mobile Selection
loginType.addEventListener("change", function () {

    identity.value = "";

    if (this.value === "email") {

        identity.type = "email";
        identity.placeholder = "Enter your email";
        identity.maxLength = 50;
        identity.removeAttribute("pattern");
        identity.setAttribute("autocomplete", "email");

        identityLabel.textContent = "Email ID :";

    } else {

        identity.type = "tel";
        identity.placeholder = "Enter 10 digit mobile number";
        identity.maxLength = 10;
        identity.pattern = "[0-9]{10}";
        identity.inputMode = "numeric";
        identity.setAttribute("autocomplete", "tel");

        identityLabel.textContent = "Contact Number :";

    }
});

// Password Login
passwordBtn.addEventListener("click", function () {

    passwordGroup.style.display = "flex";
    otpGroup.style.display = "none";

    password.required = true;
    password.disabled = false;

    otp.required = false;
    otp.disabled = true;

    passwordBtn.classList.add("active");
    otpBtn.classList.remove("active");

});

// OTP Login
otpBtn.addEventListener("click", function () {

    passwordGroup.style.display = "none";
    otpGroup.style.display = "flex";

    password.required = false;
    password.disabled = true;

    otp.required = true;
    otp.disabled = false;

    otpBtn.classList.add("active");
    passwordBtn.classList.remove("active");

});

</script>

</body>
</html>
