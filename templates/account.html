
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Local Store</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

    <header class="header">
        <div class="logo">🥬 Local Store</div>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </header>

    <section style="max-width:600px; margin:50px auto;
                    padding:30px; background:white;
                    border-radius:12px;">

<h2>My Account</h2>

<p>Name: {{ user.name }} {{ user.surname }}</p>

<p>Email: {{ user.email }}</p>

<p>Contact: {{ user.contact }}</p>

<a href="{{ url_for('logout') }}">Logout</a>

    </section>

</body>
</html>
